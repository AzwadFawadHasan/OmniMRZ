[tox]
envlist = py38, py39, py310, py311, py312
skip_missing_interpreters = true

[testenv]
deps =
    -e .[dev]
commands =
    pytest {posargs}
    black --check --diff .
    isort --check-only --diff .
    flake8 .

[testenv:docs]
deps =
    sphinx
    sphinx-rtd-theme
commands =
    sphinx-build -b html docs/ docs/_build/html

[testenv:coverage]
deps =
    -e .[dev]
commands =
    pytest --cov=omnimrz --cov-report=html --cov-report=term-missing